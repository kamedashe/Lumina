[package]
name = "lumina"
version = "0.1.0"
description = "Lumina AI Assistant"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Дефолтный dev-профиль собирает всё, включая зависимости, с полной отладочной
# информацией (debug = 2). Для чужих крейтов она не нужна, а .rlib раздувает
# так, что на машине с занятым commit-лимитом rustc падает с
# «failed to mmap ... файл подкачки слишком мал» (os error 1455).
[profile.dev]
debug = 1 # строки для трейсбеков нашего кода оставляем

[profile.dev.package."*"]
debug = false # зависимости отлаживать не собираемся

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] } # запросы + потоковый разбор ответов
rquickjs = { version = "0.6.2", features = ["macro"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
window-vibrancy = "0.7.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
pdf-extract = "0.7.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
sqlite-vec = "0.1.9"
